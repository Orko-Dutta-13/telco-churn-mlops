# .github/workflows/deploy.yml
# ─────────────────────────────────────────────────────────────────
# CI/CD Pipeline — Telco Churn MLOps
#
# Every push to main:
#   1. Runs unit tests
#   2. Builds Lambda-compatible Docker image
#   3. Pushes image to Amazon ECR
#   4. Updates AWS Lambda
# ─────────────────────────────────────────────────────────────────

name: Build and Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:

  # ==============================================================
  # JOB 1 — TEST
  # ==============================================================

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: |
          pip install -r requirements.lambda.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/test_predict.py -v


  # ==============================================================
  # JOB 2 — BUILD AND DEPLOY
  # ==============================================================

  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    # Deployment happens only if tests pass
    needs: test

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Configure AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1


      # ----------------------------------------------------------
      # Login to Amazon ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------------------
      # Setup Docker Buildx
      # ----------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------
      # Build Lambda image
      #
      # IMPORTANT:
      # Lambda = x86_64
      # Docker = linux/amd64
      #
      # --provenance=false prevents the AWS Lambda
      # unsupported-manifest problem.
      # ----------------------------------------------------------

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -f Dockerfile.lambda \
            -t telco-churn-api-lambda:latest \
            --load \
            .


      # ----------------------------------------------------------
      # Tag and push image
      # ----------------------------------------------------------

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          docker tag telco-churn-api-lambda:latest \
            $ECR_REGISTRY/telco-churn-api:$IMAGE_TAG

          docker tag telco-churn-api-lambda:latest \
            $ECR_REGISTRY/telco-churn-api:latest

          docker push \
            $ECR_REGISTRY/telco-churn-api:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/telco-churn-api:latest

          echo "IMAGE_URI=$ECR_REGISTRY/telco-churn-api:$IMAGE_TAG" >> $GITHUB_ENV


      # ----------------------------------------------------------
      # Deploy new image to Lambda
      # ----------------------------------------------------------

      - name: Deploy to Lambda
        run: |

          aws lambda update-function-code \
            --function-name telco-churn-api \
            --image-uri $IMAGE_URI \
            --architectures x86_64 \
            --region us-east-1

          echo "Deployed image: $IMAGE_URI"


      # ----------------------------------------------------------
      # Wait until Lambda finishes updating
      # ----------------------------------------------------------

      - name: Verify deployment
        run: |

          aws lambda wait function-updated \
            --function-name telco-churn-api \
            --region us-east-1

          echo "Lambda updated successfully."


      # ----------------------------------------------------------
      # Test public health endpoint
      # ----------------------------------------------------------

      - name: Test deployed API
        run: |

          curl --fail \
            https://zndftpq9ue.execute-api.us-east-1.amazonaws.com/prod/health

          echo ""
          echo "Health check successful."